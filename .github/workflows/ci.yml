name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=finflow --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    env:
      FINFLOW_LOG_FILE: logs/finflow.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate sample data (with injected defects)
        run: finflow generate --with-defects
      - name: Run full ELT pipeline
        run: finflow run
      - name: Show warehouse tables
        run: finflow tables
      - name: Upload run logs and data quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run
          path: |
            logs/finflow.jsonl
            data/warehouse.db
